services:
  database:
    image: postgres:16-alpine
    container_name: photography-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: photographer_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-photography_dev}
    volumes:
      - photography-local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photographer_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: elvove-backend:local
    container_name: photography-local-backend
    restart: unless-stopped
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      DB_URL: jdbc:postgresql://database:5432/photographer_portfolio
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      FRONTEND_URL: "http://localhost:8090,http://localhost:5173,http://localhost:5174"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD wajib diisi}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL wajib diisi}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ELVOVE Photography}
    ports:
      - "8080:8080"
    volumes:
      - ./local-data/uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: elvove-frontend:local
    container_name: photography-local-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: photography-local-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  photography-local-db: